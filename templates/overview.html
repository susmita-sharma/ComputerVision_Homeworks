{% extends "shell.html" %}
{% block content %}
<style>
  .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .hub-tile { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px; color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s; }
  .hub-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .hub-tile .tag { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  .hub-tile h2 { margin: 6px 0 8px; font-size: 18px; }
  .hub-tile p { margin: 0 0 14px; font-size: 14px; color: #5b6672; line-height: 1.45; flex-grow: 1; }
  .hub-tile .open { font-size: 14px; font-weight: 600; color: var(--accent); }
</style>
<div class="card">
  <h1>CSc 8830 Computer Vision</h1>
  <p class="muted">Choose a homework or challenge to open it.</p>
</div>

<div class="hub-grid">
  {% for t in tiles %}
  <a class="hub-tile" href="{{ t.url }}">
    <span class="tag">{{ t.tag }}</span>
    <h2>{{ t.title }}</h2>
    <p>{{ t.text }}</p>
    <span class="open">Open &rarr;</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
